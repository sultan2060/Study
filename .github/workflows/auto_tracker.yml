name: S2 Pro 24/7 Autonomous Market Tracker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-autonomous-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance streamlit requests

      - name: Run tracker script
        run: python update_tracker.py

      - name: Commit and push updated register
        run: |
          git config --global user.name 'S2 Pro Automation Bot'
          git config --global user.email 'bot@s2pro.research'
          git add research_register.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated 24/7 research register synchronization [skip ci]" && git push)
